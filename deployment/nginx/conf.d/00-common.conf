# Shared proxy settings, included by each server block.

# Nginx resolves upstream names once at start unless told otherwise; Docker's
# embedded DNS lets a restarted container come back on a new IP.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
# Pass the request id down so the API can adopt it instead of minting its own.
proxy_set_header X-Request-ID      $request_id;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
proxy_buffering       on;
proxy_buffer_size     8k;
proxy_buffers         16 8k;

# Requests are not silently retried on a non-idempotent method: replaying a
# POST /orders after a timeout is how a customer gets charged twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
