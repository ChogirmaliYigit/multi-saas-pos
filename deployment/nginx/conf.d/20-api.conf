# api.<BASE_DOMAIN> -- the FastAPI backend.
#
# Substitute the real domain with:
#   ./deployment/scripts/configure-nginx.sh saas-pos.com

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.__BASE_DOMAIN__;

    # certbot names the directory after the certificate's first domain, so
    # an api-only certificate lives under api.<domain>, not <domain>. The
    # wildcard certificate in 30-app.conf is the one under <domain>.
    ssl_certificate     /etc/letsencrypt/live/api.__BASE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__BASE_DOMAIN__/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    # HSTS is set here rather than in the app: it must be sent even on
    # responses the app never generates, like a 502.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_conn perip 40;

    # Re-resolved per request so a redeployed container is picked up without
    # restarting Nginx. The resolver comes from ssl-params.inc.
    set $api_upstream "api:8000";

    # Brute-force surface. burst=3 with nodelay lets a person who fat-fingered
    # their password retry immediately, while a script hits the wall.
    location = /api/v1/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/auth/signup {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://$api_upstream;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://$api_upstream;
    }

    # Report downloads stream a generated file; the default read timeout is
    # too tight for a large export on a slow connection.
    location ~ ^/api/v1/reports/[^/]+/download$ {
        proxy_pass http://$api_upstream;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        proxy_pass http://$api_upstream;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://$api_upstream;
    }

    # Nothing else is served from the API host.
    location / {
        return 404;
    }
}
