user  nginx;
# One worker per core; auto reads the cgroup limit inside a container.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $request_id ties an Nginx line to the API's X-Request-ID, so one
    # identifier follows a request across both logs.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id rt=$request_time '
                      'ua=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Receipts and report downloads can be large; the API itself caps upload
    # size, this is the outer bound.
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript
                      image/svg+xml;

    # --- rate limiting -----------------------------------------------------
    # Login is the endpoint worth brute-forcing. The API also locks an account
    # after 5 failures, but that is per-account: this limits the attacker's
    # rate across every account at once.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # --- upstreams ---------------------------------------------------------
    upstream pos_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    # No `upstream` block for the frontend, deliberately.
    #
    # Nginx resolves upstream server names once, at startup, and refuses to
    # start if one does not resolve. With the frontend on Vercel -- the default
    # -- the `frontend` container does not exist, so an upstream block here
    # took the entire VPS down, API included. The site config uses a variable
    # in proxy_pass instead, which defers resolution to request time: Nginx
    # starts either way, and simply returns 502 for the app host when no
    # frontend is running.

    # Honour the real client IP behind a cloud load balancer, if there is one.
    # Left narrow on purpose: trusting an arbitrary X-Forwarded-For lets a
    # caller forge their own address and walk around the rate limits.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
