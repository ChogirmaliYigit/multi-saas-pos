line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "B", "I", "UP", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "SIM117", # nested `async with` reads better here than a combined one when
              # the scopes carry different meanings (tenant vs auth-lookup)
]

[lint.per-file-ignores]
"alembic/versions/*" = ["E402"]
"app/models/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["app"]
