# Port 80: ACME challenges, and a redirect for everything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Compose healthcheck. Kept on HTTP so it works before certificates exist.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # certbot --webroot writes its challenge files here. This must stay on
    # plain HTTP and must not redirect, or renewal fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
