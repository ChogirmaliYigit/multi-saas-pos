# The frontend: apex, www, and every tenant subdomain.
#
# Only enabled with the "selfhost" compose profile. On Vercel, delete this
# file and point DNS at Vercel instead -- Nginx then serves the API alone.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # The wildcard is the whole point of subdomain tenancy: shop1, shop2 and
    # every future shop resolve here without touching Nginx. It needs a
    # wildcard certificate (DNS-01), which is why certbot uses a DNS plugin
    # for this host rather than the webroot challenge.
    server_name localhost www.localhost *.localhost;

    ssl_certificate     /etc/letsencrypt/live/localhost/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localhost/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.inc;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    limit_conn perip 60;

    # Immutable build assets. Next fingerprints these filenames, so a long
    # max-age is safe and saves a round trip on every navigation.
    # Docker's embedded DNS, resolved per request. Nginx resolves names in
    # an `upstream` block once at startup and refuses to boot if one is
    # missing -- with the frontend on Vercel that took the whole VPS down,
    # API included. A variable in proxy_pass defers resolution, so this server
    # block costs nothing when no frontend is deployed here.
    # (The resolver itself comes from ssl-params.inc, which needs one for
    # OCSP stapling. Declaring a second here is a duplicate-directive error.)
    set $frontend_upstream "frontend:3000";

    location /_next/static/ {
        proxy_pass http://$frontend_upstream;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        # Next dev/HMR and any future streaming need the upgrade dance.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
